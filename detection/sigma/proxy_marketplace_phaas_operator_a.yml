title: Marketplace PhaaS Operator-A Kit Victim URL
id: 3f6c2b1e-9a4d-4e57-8c1a-6b0d2e7f5a91
status: experimental
description: |
    Detects a client opening a per-victim URL of the "Operator A" marketplace phishing kit
    (Classiscam/Telekopye-class; fake "receive your payment" pages impersonating OLX, Subito,
    Kleinanzeigen, Blocket, InPost and others). The kit rotates domains daily, so this rule keys on
    the URL structure, not domains. A hit means a user (typically a seller) opened a lure link and
    may have entered card/OTP data.
references:
    - https://github.com/malek-alhu/marketplace-phaas-tracker
author: marketplace-phaas-tracker contributors
date: 2026-09-30
tags:
    - attack.initial-access
    - attack.t1566.002
    - detection.threat-hunting
logsource:
    category: proxy
detection:
    selection_entry:
        c-uri|re: '/a/[A-Za-z0-9_-]{12,24}\?us=(gm|dlm|sml|ym|cg)(&|$)'
    selection_card_module:
        c-uri|re: '/m/[A-Za-z0-9_-]{8,32}/c3RyaXBl'
    condition: 1 of selection_*
falsepositives:
    - Unlikely; the /a/<token>?us=<code> shape plus the c3RyaXBl ("stripe" in base64) module path are kit-specific
level: high
